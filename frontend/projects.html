<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - AI Content Studio</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/env.js" defer></script>
    <script src="/config.js" defer></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                AI Content <span>Studio</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="nav-item">
                    <i>📊</i> Dashboard
                </a>
                <a href="/projects.html" class="nav-item active">
                    <i>📁</i> Projects
                </a>
                <a href="/generation-progress.html" class="nav-item">
                    <i>⚡</i> Batch Generation
                </a>
                <a href="/assets.html" class="nav-item">
                    <i>🖼️</i> Asset Browser
                </a>
                <a href="/export.html" class="nav-item">
                    <i>📦</i> Selective Export
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/settings.html" class="nav-item">
                    <i>⚙️</i> Settings
                </a>
                <a href="#" id="logoutBtn" class="nav-item">
                    <i>🚪</i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="page-title">Project Management</div>
                <div class="user-menu">
                    <button class="btn btn-primary btn-sm" id="openNewProjectModal">➕ New Project</button>
                    <span id="userEmail" class="ml-2">Loading...</span>
                </div>
            </header>

            <div class="page-container">
                <div id="projectAlert" class="alert mb-4"></div>

                <div class="glass-panel" style="padding: 1.5rem;">
                    <div class="flex justify-between items-center mb-4">
                        <h2>Your Production Projects</h2>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Project Name</th>
                                    <th>Generation Mode</th>
                                    <th>Status</th>
                                    <th>Scenes</th>
                                    <th>Created Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="projectsTableBody">
                                <tr><td colspan="6" class="text-muted text-center">Loading projects...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Project Modal -->
    <div id="createProjectModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:1000; align-items:center; justify-content:center;">
        <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2rem;">
            <h3>Create New Production Project</h3>
            <form id="createProjectForm" class="mt-4">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" class="form-control" placeholder="e.g. Ancient Rome Documentary" required>
                </div>
                <div class="form-group">
                    <label for="projectMode">Default Media Mode</label>
                    <select id="projectMode" class="form-select">
                        <option value="IMAGE_VOICE">Image + Voiceover (Standard)</option>
                        <option value="VIDEO_VOICE">Video + Voiceover (Veo / Merge)</option>
                        <option value="IMAGE_ONLY">Image Only</option>
                    </select>
                </div>
                <div class="d-flex gap-2 justify-end mt-4">
                    <button type="button" class="btn btn-secondary" id="closeModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Project Workspace</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Shell.init();
            if (!user) return;

            const modal = document.getElementById('createProjectModal');
            document.getElementById('openNewProjectModal').onclick = () => modal.style.display = 'flex';
            document.getElementById('closeModalBtn').onclick = () => modal.style.display = 'none';

            async function loadProjects() {
                try {
                    const projects = await API.get('/api/projects');
                    const tbody = document.getElementById('projectsTableBody');

                    if (!projects || projects.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center">No projects found. Click "New Project" to create one.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = projects.map(p => `
                        <tr>
                            <td><strong>${Fmt.esc(p.name)}</strong></td>
                            <td><span class="badge badge-secondary">${Fmt.esc(p.mode || 'IMAGE_VOICE')}</span></td>
                            <td>${Status.badge(p.worker_active ? 'PROCESSING' : p.status)}</td>
                            <td>${p.completed_scenes || 0} / ${p.total_scenes || 0}</td>
                            <td>${Fmt.date(p.created_at)}</td>
                            <td class="d-flex gap-2">
                                <a href="/project-detail.html?id=${p.id}" class="btn btn-primary btn-sm">Workspace</a>
                                <button class="btn btn-danger btn-sm" onclick="deleteProject(${p.id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } catch(e) {
                    document.getElementById('projectsTableBody').innerHTML =
                        `<tr><td colspan="6" class="text-danger">${Fmt.esc(e.message)}</td></tr>`;
                }
            }

            document.getElementById('createProjectForm').onsubmit = async (e) => {
                e.preventDefault();
                const name = document.getElementById('projectName').value;
                const mode = document.getElementById('projectMode').value;

                try {
                    const res = await API.post('/api/projects', { name, mode, scenes: [] });
                    modal.style.display = 'none';
                    window.location.href = `/project-detail.html?id=${res.id}`;
                } catch(e) {
                    Toast.error(e.message);
                }
            };

            window.deleteProject = async (id) => {
                if (!confirm('Are you sure you want to delete this project and all associated scenes?')) return;
                try {
                    await API.delete(`/api/projects/${id}`);
                    Toast.success('Project deleted');
                    loadProjects();
                } catch(e) {
                    Toast.error(e.message);
                }
            };

            loadProjects();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Content Studio</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">

    <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI Content <span style="color:var(--accent); -webkit-text-fill-color:var(--accent);">Studio</span></h1>
            <p class="text-muted mt-2" style="font-size: 0.9rem;">Sign in to your production workspace</p>
        </div>

        <div id="authAlert" class="alert mb-4"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <div class="flex justify-between items-center mb-1">
                    <label for="password">Password</label>
                    <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
                </div>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary mt-4" style="width: 100%; font-size: 1rem; padding: 0.85rem;" id="loginBtn">Sign In to Dashboard</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;" class="text-muted">
            Don't have an account? <a href="/register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create an account</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const alertEl = document.getElementById('authAlert');
            const loginBtn = document.getElementById('loginBtn');

            loginForm.onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in...';

                try {
                    const res = await Auth.signIn(email, password);
                    if (res.error) throw res.error;

                    alertEl.textContent = "Sign in successful! Redirecting...";
                    alertEl.className = 'alert alert-success show';

                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                } catch(err) {
                    alertEl.textContent = err.message || "Invalid credentials";
                    alertEl.className = 'alert alert-error show';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In to Dashboard';
                }
            };
        });
    </script>
</body>
</html>

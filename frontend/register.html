<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Content Studio</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/env.js" defer></script>
    <script src="/config.js" defer></script>
    <script src="/static/js/app.js" defer></script>
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">

    <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI Content <span style="color:var(--accent); -webkit-text-fill-color:var(--accent);">Studio</span></h1>
            <p class="text-muted mt-2" style="font-size: 0.9rem;">Create your production account</p>
        </div>

        <div id="authAlert" class="alert mb-4"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
            </div>

            <button type="submit" class="btn btn-primary mt-4" style="width: 100%; font-size: 1rem; padding: 0.85rem;" id="registerBtn">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;" class="text-muted">
            Already have an account? <a href="/login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const alertEl = document.getElementById('authAlert');
            const btn = document.getElementById('registerBtn');

            form.onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    alertEl.textContent = "Passwords do not match!";
                    alertEl.className = 'alert alert-error show';
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Creating account...';

                try {
                    const res = await Auth.signUp(email, password);
                    if (res.error) throw res.error;

                    alertEl.textContent = "Account created! Redirecting to dashboard...";
                    alertEl.className = 'alert alert-success show';

                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } catch(err) {
                    alertEl.textContent = err.message || "Registration failed";
                    alertEl.className = 'alert alert-error show';
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            };
        });
    </script>
</body>
</html>

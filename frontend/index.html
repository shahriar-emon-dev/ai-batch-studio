<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ContentStudio</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/env.js" defer></script>
    <script src="/config.js" defer></script>
</head>
<body>
    <div class="page-container" style="max-width: 480px; margin: 12vh auto; text-align: center;">
        <div class="glass-panel" style="padding: 2.5rem;">
            <h1 class="page-title">AI ContentStudio</h1>
            <p class="text-muted mt-2">Intelligent CSV-driven image, voiceover and video batch generation.</p>
            <p class="text-muted mt-4" id="redirectStatus">Checking your session…</p>
            <div class="flex gap-2 mt-4" style="justify-content: center;">
                <a href="/dashboard.html" class="btn btn-primary">Open Dashboard</a>
                <a href="/login.html" class="btn btn-secondary">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // Single entry point: signed-in users land on the dashboard, everyone
        // else on the login screen. The production app lives in the
        // multi-page workspace (dashboard / projects / progress / assets).
        document.addEventListener('DOMContentLoaded', async () => {
            const status = document.getElementById('redirectStatus');
            try {
                const user = await Auth.getUser();
                status.textContent = user ? 'Signed in — opening your dashboard…' : 'Please sign in to continue.';
                window.location.replace(user ? '/dashboard.html' : '/login.html');
            } catch {
                status.textContent = 'Could not verify your session.';
                window.location.replace('/login.html');
            }
        });
    </script>
</body>
</html>
